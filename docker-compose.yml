services:
  db:
    image: postgres:18-alpine
    container_name: trial-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trial
      POSTGRES_PASSWORD: trial
      POSTGRES_DB: trial_booking
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images store data in a major-version subdirectory, so the
      # mount goes at /var/lib/postgresql, not /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trial -d trial_booking"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
