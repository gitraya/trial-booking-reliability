name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://trial:trial@localhost:5432/trial_booking?schema=public

jobs:
  test:
    name: Typecheck, build & test
    runs-on: ubuntu-latest

    # The concurrency tests exercise Postgres's row-level write atomicity, so
    # they need a real Postgres — there is nothing here a mock could stand in
    # for. Same major version as production and local dev.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: trial
          POSTGRES_PASSWORD: trial
          POSTGRES_DB: trial_booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trial -d trial_booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated TypeScript under src/generated and is
      # gitignored, so nothing typechecks or builds until this runs.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Verify the partial unique index exists
        # This index is hand-written into the migration SQL rather than
        # expressed in schema.prisma, which makes it the single most likely
        # thing to be silently lost when migrations are regenerated. It is the
        # authoritative duplicate-booking guard, so CI asserts it is really
        # there rather than trusting the schema.
        run: |
          PGPASSWORD=trial psql -h localhost -U trial -d trial_booking -tAc \
            "SELECT indexdef FROM pg_indexes WHERE indexname = 'booking_active_unique'" \
            | tee /tmp/idx.txt
          grep -q 'UNIQUE INDEX' /tmp/idx.txt
          grep -q 'PENDING_PAYMENT' /tmp/idx.txt
          grep -q 'CONFIRMED' /tmp/idx.txt
          echo "booking_active_unique present with the expected predicate"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Builds the exact image Coolify will build, so a broken Dockerfile is
      # caught here rather than on the VPS. Not pushed anywhere — Coolify
      # builds from source on its own.
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: trial-booking:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
